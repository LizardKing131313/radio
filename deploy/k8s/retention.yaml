apiVersion: batch/v1
kind: CronJob
metadata:
  name: radio-retention
spec:
  # Run after the daily backup so cleanup never removes the newest dump first.
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: radio-retention
        spec:
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              image: radio-manager:latest
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsGroup: 10001
                runAsNonRoot: true
                runAsUser: 10001
              command: [ "python", "-m", "manager", "retention", "--delete" ]
              envFrom:
                - secretRef:
                    name: radio-secrets
              volumeMounts:
                - name: radio-config
                  mountPath: /opt/radio/data
                - name: radio-cache
                  mountPath: /opt/radio/cache
          volumes:
            - name: radio-config
              configMap:
                name: radio-config
            - name: radio-cache
              persistentVolumeClaim:
                claimName: radio-cache
